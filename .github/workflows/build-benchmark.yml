name: Reusable Benchmark

on:
  workflow_call:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark
      cancel-in-progress: false
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download benchmark data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-*
          path: benchmarks

      - name: merge benchmark data
        run: jq -s 'add' benchmarks/*/benchmark.json > benchmark.json

      - name: check gh-pages branch
        id: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "skip-fetch=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip-fetch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Fastfetch
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          auto-push: true
          skip-fetch-gh-pages: ${{ steps.gh-pages.outputs.skip-fetch }}
          summary-always: true
          fail-on-alert: true
          benchmark-data-dir-path: dev/bench
